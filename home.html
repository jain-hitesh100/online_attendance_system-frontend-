<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f7f9fa;
      color: #333;
    }
    h2 {
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p {
      margin-bottom: 20px;
    }
    .quick-links {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .quick-links button {
      padding: 12px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .quick-links button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 12px;
      text-align: center;
    }
    blockquote {
      font-style: italic;
      color: gray;
      border-left: 4px solid #ccc;
      padding-left: 10px;
    }
  </style>
</head>
<body>

  <h2>Welcome to the Student Management Dashboard</h2>
 
  


</body>
</html>
