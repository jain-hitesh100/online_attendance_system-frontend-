<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Online Attendance System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .contact-container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
    }
    h2 {
      text-align: center;
      color: #003366;
    }
    .info {
      margin-top: 20px;
      padding: 10px;
      background-color: #e6f0ff;
      border-left: 4px solid #0066cc;
      border-radius: 8px;
    }
    .info p {
      margin: 8px 0;
      font-size: 16px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    form {
      display: flex;
      flex-direction: column;
      margin-top: 20px;
    }
    label {
      margin-top: 10px;
      font-weight: 600;
    }
    input, textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #004d99;
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <h2>Contact Us</h2>

    <div class="info">
      <p><strong>Phone:</strong> +91 1234567890</p>
      <p><strong>Email:</strong> <a href="mailto:attendance@example.com">attendance@example.com</a></p>
      <p><strong>Website:</strong> <a href="https://www.onlineattendance.com" target="_blank">www.onlineattendance.com</a></p>
    </div>

    <form action="mailto:attendance@example.com" method="post" enctype="text/plain">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
