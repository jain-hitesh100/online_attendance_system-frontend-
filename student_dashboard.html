<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard with Sidebar & Iframe</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Arial, sans-serif;
      height: 100vh;
        background-image: url('https://pu.ac.in/photos/pu9.jpg');
  background-size: cover;
  background-position: center;
    }

    .sidebar {
      width: 270px;
      background-color: rgb(121, 12, 222);
      color: white;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h2 {
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #66b5fe;
    }

    .menu-section {
      padding: 10px 0;
    }

    .menu-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      color: white;
      text-decoration: none;
      transition: background 0.3s;
      cursor: default;
    }

    .menu-item i {
      margin-right: 15px;
      width: 20px;
      text-align: center;
    }

    .menu-item:hover {
      background-color: #34495ef1;
    }

    .submenu {
      padding-left: 50px;
      font-size: 14px;
    }

    .submenu a {
      display: block;
      color: #ddd;
      text-decoration: none;
      padding: 5px 0;
      cursor: pointer;
    }

    .submenu a:hover {
      color: #fff;
    }

    .main-content {
      flex: 1;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      float: left;
      margin-left: 5px;
    }

    #student-id {
      margin-top: 20px;
      padding-top: 15px;
      padding-left: 20px;
      margin-left: 50px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="profile">
      <img src="https://tse4.mm.bing.net/th?id=OIP.cbuzKfl-6z6fxmdh5JRP8gHaHa&pid=Api&P=0&h=180" alt="lion logo">
      <p id="student-id">Username</p>
    </div>

    <div class="menu-section">
      <div class="menu-item" onclick="('lagnding.html')">
        <i class="fas fa-home"></i>Home
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-item"><i class="fas fa-user-graduate"></i>Students</div>
      <div class="submenu">
        <a onclick="loadPage('students of apply leave.html')">Apply Leave</a>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-item"><i class="fas fa-chalkboard-teacher"></i>Teachers</div>
      <div class="submenu">
        <a onclick="loadPage('teacher.html')">Leave Approval</a>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-item"><i class="fas fa-cogs"></i>Settings</div>
      <div class="submenu">
        <a onclick="loadPage('setting of student master.html')">Student Master</a>
        <a onclick="loadPage('setting of teacher master.html')">Teacher Master</a>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-item"><i class="fas fa-chart-bar"></i>Reports</div>
      <div class="submenu">
        <a onclick="loadPage('report of attendance.html')">Attendance Report</a>
        <a onclick="loadPage('report of leave.html')">Leave Report</a>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-item"><i class="fas fa-sign-out-alt"></i>Logout</div>
      <div class="submenu">
        <a href="login.html">Logout</a>
      </div>
    </div>
  </div>

  <div class="main-content">
    <iframe id="mainFrame" src="home.html"></iframe>
  </div>

  <script>
    function loadPage(page) {
      document.getElementById('mainFrame').src = page;
    }

    // Load username from localStorage
    const username = localStorage.getItem("username");
    document.getElementById("student-id").innerText = username ? username : "Guest";
  </script>
</body>
</html>
