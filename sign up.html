<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background-image: url('../lib.jpg');
      background-size: cover;
      background-position: center;
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.92);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 320px;
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 20px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
      display: block;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="password"],
    select {
      width: 100%;
      padding: 5px;
      margin-top: 3px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .radio-group label {
      font-weight: normal;
      font-size: 13px;
    }

    .section-heading {
      font-size: 14px;
      font-weight: bold;
      margin: 8px 0 2px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }

    button {
      width: 48%;
      padding: 7px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .signin-link {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }

    .signin-link a {
      color: #007bff;
      text-decoration: none;
    }

    .signin-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Registration Form</h2>
    <form>

      <div class="section-heading">Role</div>
      <div class="radio-group">
        <label><input type="radio" name="role" value="Student" required> Student</label>
        <label><input type="radio" name="role" value="Teacher"> Teacher</label>
      </div>

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="mobile">Mobile No.</label>
      <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>

      <label>Class</label>
      <div class="radio-group">
        <label><input type="radio" name="class" value="CSE" required> CSE</label>
        <label><input type="radio" name="class" value="IT"> IT</label>
        <label><input type="radio" name="class" value="ECE"> ECE</label>
        <label><input type="radio" name="class" value="EEE"> EEE</label>
        <label><input type="radio" name="class" value="MECH"> MECH</label>
        <label><input type="radio" name="class" value="BIO-TEC"> BIO-TEC</label>
      </div>

      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>

      <label for="year">Year</label>
      <select id="year" name="year" required>
        <option value="">-- Select Year --</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>

      <label for="email">Gmail</label>
      <input type="email" id="email" name="email" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="password">Create Password</label>
      <input type="password" id="password" name="password" required>

      <div class="buttons">
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
      </div>

      <div class="signin-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </form>
  </div>
</body>
</html>
